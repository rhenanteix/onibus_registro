name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Relatório das referências
        run: npm run report:referencias:check
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
      - name: Sintaxe do service worker
        run: node --check public/sw.js
        working-directory: .
